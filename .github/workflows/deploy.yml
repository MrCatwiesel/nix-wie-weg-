# Baut die App bei jedem Push auf "main" und veröffentlicht sie auf GitHub Pages.
# Einmalig in GitHub: Settings → Pages → Source: "GitHub Actions".
name: Build und Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      # Fertige App zusätzlich als ZIP zum Herunterladen (z. B. für den Tiny-Server)
      - uses: actions/upload-artifact@v4
        with:
          name: nix-wie-weg-app
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Eigener Job: zeigt Typfehler deutlich (rot), blockiert die Veröffentlichung aber nicht
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck

  # Abgleich-Server: eigene Tests (nur Node.js, keine Pakete)
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test
        working-directory: server

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
